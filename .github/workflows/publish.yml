name: Publish to npm

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Check package version matches tag
        shell: pwsh
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $tagVersion = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if ($packageVersion -ne $tagVersion) {
            throw "package.json version $packageVersion does not match tag $tagVersion"
          }

      - name: Syntax check
        run: |
          for f in src/*.js; do node --check "$f"; done

      - name: Check package content
        run: npm pack --dry-run

      - name: Determine dist-tag
        id: disttag
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          $major = [int]($version.Split(".")[0])
          $tag = if ($major -lt 2) { "legacy-1x" } else { "latest" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish
        run: npm publish --access public --tag ${{ steps.disttag.outputs.tag }}

      - name: Create GitHub Release
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          # A 1.x release must not take the "Latest" label from 2.x.
          $latest = if ([int]($version.Split(".")[0]) -lt 2) { "false" } else { "true" }
          gh release create "${env:GITHUB_REF_NAME}" --latest=$latest --generate-notes --notes "Published to npm: https://www.npmjs.com/package/@wynenterprise/sign-sbom/v/$version"
        env:
          GH_TOKEN: ${{ github.token }}
